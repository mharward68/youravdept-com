# youravdept.com: Netlify config added by the Offers Module (Session 1.2).
# Most site config still lives in _redirects and _headers. This file is read
# from the site folder by the Netlify CLI and is never published (both deploy
# scripts exclude it).

# The page dropdown in the offer editor lists the site's real pages.
# Session 1.4's offers-pages function reads these files at runtime.
[functions."offers-pages"]
  included_files = ["*.html", "library/*.html", "field-notes/*.html"]

# Offer links and admin screens stay out of search results.
# These apply to static responses only. Edge function responses (/offer/*
# in Session 1.5) must set X-Robots-Tag in code as well.
[[headers]]
  for = "/offer/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/offer-admin*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/offers-form*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Session 1.7: the admin screen at its short address. Not forced, so it only
# applies when no file sits at /offer-admin. _redirects is left untouched.
[[redirects]]
  from = "/offer-admin"
  to = "/offer-admin.html"
  status = 200

# Second lock: build docs and function sources are never served, even if a
# deploy script ever forgets to exclude them.
[[redirects]]
  from = "/ai/*"
  to = "/404-not-here"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404-not-here"
  status = 404
  force = true

# Just the Audio (2026-10-11). Source: the 19_mp4-mp3_converter project.
# The converter may only talk to its own address. This is the "files never leave this computer" promise.
[[headers]]
  for = "/just-the-audio/app/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; object-src 'none'"
    X-Content-Type-Options = "nosniff"
    X-Robots-Tag = "noindex"

# Installed copies must notice new versions.
[[headers]]
  for = "/just-the-audio/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Just the Audio activity page: private, never in search.
[[headers]]
  for = "/just-the-audio-activity*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
